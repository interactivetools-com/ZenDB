name: FK Names Matrix

# Checks how every database in the matrix names foreign keys, and whether
# Table::foreignKeys() and Table::foreignKeysReferencing() report them correctly.
# Manual-only. Dispatch with: gh workflow run fk-names-matrix.yml --ref <branch>
# To check images outside the matrix: gh workflow run fk-names-matrix.yml -f databases="mariadb:12.0 mariadb:12.1"
on:
  workflow_dispatch:
    inputs:
      databases:
        description: 'Docker images to probe, space-separated (blank = .github/db-matrix.json)'
        required: false
        type: string

# the jobs only read the code
permissions:
  contents: read

jobs:
  db-matrix:
    name: Load database matrix
    runs-on: ubuntu-slim  # starts faster; has no PHP or Docker
    timeout-minutes: 15
    outputs:
      databases: ${{ steps.load.outputs.databases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      - name: Read the databases input or .github/db-matrix.json
        id: load
        env:
          DATABASES: ${{ inputs.databases }}  # free-form text: passed as an env var so the shell gets it as data
        run: |
          if [ -n "$DATABASES" ]; then
            echo "databases=$(jq -cn --arg list "$DATABASES" '$list | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          else
            echo "databases=$(jq -c . .github/db-matrix.json)" >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    needs: db-matrix
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.db-matrix.outputs.databases) }}

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: '%'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --innodb_initialized || mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --security-opt seccomp=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      # composer.json path repositories point at ../SmartString and ../SmartArray
      - name: Checkout SmartString and SmartArray
        run: |
          git clone --depth 1 https://github.com/interactivetools-com/SmartString.git ../SmartString
          git clone --depth 1 https://github.com/interactivetools-com/SmartArray.git ../SmartArray

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5  # takes under 3 min; setup-php can hang on macOS
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null && break
            sleep 1
          done

      - name: Run probe
        env:
          DB_HOSTNAME: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_LABEL: ${{ matrix.database }}
        run: |
          SLUG=$(echo "$DB_LABEL" | tr ':/' '--')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          php .github/scripts/fk-names-probe.php --json="fk-probe-$SLUG.json"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fk-probe-${{ env.SLUG }}
          path: fk-probe-*.json
          if-no-files-found: ignore

  summary:
    name: Compare servers
    runs-on: ubuntu-latest
    needs: probe
    timeout-minutes: 15
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      - name: Download probe results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fk-probe-*
          merge-multiple: true
          path: probes

      - name: Build comparison
        run: php .github/scripts/fk-names-probe.php --merge probes/*.json | tee fk-names-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fk-names-matrix
          path: fk-names-matrix.md
