name: Escape E2E Matrix

# Manual-only: never runs on push. Dispatch from the Actions tab ("Run workflow") or
# with: gh workflow run escape-e2e-matrix.yml
#
# End-to-end family of the escape benchmark suite: every way values get into
# queries (escaped interpolation, mysqli prepared, execute_query, PDO native and
# emulated prepares, hex literals) timed as whole round trips per DB server, plus
# the restore-and-compare correctness gate. Round-trip counts and server cost are
# what vary here, so the matrix dimension is the database, not PHP or OS: jobs run
# ubuntu at the PHP 8.1 floor against a subset of db-matrix.json (blank input =
# the subset below; a full sweep adds little because client-side behavior is
# identical across servers). See .github/scripts/escape-e2e-probe.php.
on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database (blank = representative subset)'
        required: false
        type: choice
        # Dropdown convenience only - the canonical list is .github/db-matrix.json
        options:
          - ''
          - mysql:5.7
          - mysql:8.0
          - mysql:8.4
          - mysql:9.7
          - mariadb:10.6
          - mariadb:11.8
          - mariadb:12.3
          - percona/percona-server:8.0
      scale:
        description: 'Iteration scale (1.0 = full, 0.3 = quick)'
        required: false
        default: '1.0'
      filter:
        description: 'Comma-separated test ids (blank = all)'
        required: false
        default: ''

jobs:
  db-matrix:
    name: Load database matrix
    runs-on: ubuntu-latest
    outputs:
      databases: ${{ steps.load.outputs.databases }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Subset filter over the canonical list: representative servers only
      # (channel rankings are round-trip-shaped; a full 19-image sweep repeats them)
      - name: Read .github/db-matrix.json
        id: load
        run: |
          if [ -n "${{ inputs.database }}" ]; then
            LIST='["${{ inputs.database }}"]'
          else
            LIST=$(jq -c '[.[] | select(IN("mysql:5.7", "mysql:8.0", "mysql:8.4", "mariadb:10.6", "mariadb:11.8"))]' .github/db-matrix.json)
          fi
          echo "databases=$LIST" >> "$GITHUB_OUTPUT"

  probe:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    needs: db-matrix
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.db-matrix.outputs.databases) }}

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: '%'
          # MariaDB-specific (ignored by MySQL)
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --innodb_initialized || mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --security-opt seccomp=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The probe uses plain mysqli/PDO with no dependencies, so no composer install.
      # Pinned to the minimum supported PHP so the script can't drift past it
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo_mysql
          coverage: none
          # JIT set explicitly: runner images ship a non-zero jit_buffer_size, so
          # leaving it alone benchmarks with JIT on. allow_local_infile is
          # PHP_INI_SYSTEM: the LOAD DATA channel needs it here, runtime
          # options() alone can't enable it
          ini-values: opcache.enable_cli=1, opcache.jit=off, opcache.jit_buffer_size=0, mysqli.allow_local_infile=1

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null && break
            sleep 1
          done

      - name: Run probe
        env:
          DB_HOSTNAME: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_DATABASE: phpunit_test_db
          DB_LABEL: ${{ matrix.database }}
        run: |
          SLUG=$(echo "${{ matrix.database }}" | tr ':/+' '---')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          php .github/scripts/escape-e2e-probe.php \
            --json="probe-e2e-$SLUG.json" \
            --scale="${{ inputs.scale }}" \
            ${{ inputs.filter != '' && format('--filter="{0}"', inputs.filter) || '' }} \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-e2e-${{ env.SLUG }}
          path: probe-e2e-*.json
          if-no-files-found: ignore

  summary:
    name: Merge comparison grid
    runs-on: ubuntu-latest
    needs: probe
    # Aggregates every matrix job and runs even when some fail, so partial grids
    # still get built; !cancelled() keeps it out of manual cancellations only
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Download probe results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probe-e2e-*
          merge-multiple: true
          path: probes

      - name: Build comparison grid
        run: php .github/scripts/escape-merge.php probes/*.json >> "$GITHUB_STEP_SUMMARY"
