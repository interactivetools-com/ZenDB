name: Escape ZenDB Matrix

# Manual-only: never runs on push. Dispatch from the Actions tab ("Run workflow") or
# with: gh workflow run escape-zendb-matrix.yml
#
# The ZenDB-vs-raw family: DB::select()/selectOne()/query() and hand-written
# mysqli doing identical work, whole-query wall time. Loads the real library, so
# unlike the other escape workflows this one runs composer install. The
# difference is client-side PHP, so the matrix dimension is PHP version on one
# server per run (default mysql:8.0; the database and jit inputs override).
on:
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP version (blank = 8.1 + 8.4)'
        required: false
        type: choice
        options: ['', '8.1', '8.2', '8.3', '8.4', '8.5']
      scale:
        description: 'Iteration scale (1.0 = full, 0.3 = quick)'
        required: false
        default: '1.0'
      filter:
        description: 'Comma-separated test ids (blank = all)'
        required: false
        default: ''
      database:
        description: 'Database image (blank = mysql:8.0)'
        required: false
        type: choice
        options: ['', 'mysql:8.0', 'mysql:8.4', 'mariadb:11.8', 'mariadb:12.3']
      jit:
        description: 'PHP JIT (default off, matching production)'
        required: false
        type: choice
        options: ['off', 'on']
        default: 'off'

jobs:
  matrix:
    name: Load matrix
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.load.outputs.php }}
    steps:
      - name: Build matrix from inputs
        id: load
        run: |
          if [ -n "${{ inputs.php }}" ]; then
            echo 'php=["${{ inputs.php }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'php=["8.1", "8.4"]' >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: matrix
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}

    services:
      database:
        image: ${{ inputs.database || 'mysql:8.0' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: '%'
          # MariaDB-specific (ignored by MySQL)
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --innodb_initialized || mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --security-opt seccomp=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # composer.json path repositories point at ../SmartString and ../SmartArray
      - name: Checkout SmartString and SmartArray
        run: |
          git clone --depth 1 https://github.com/interactivetools-com/SmartString.git ../SmartString
          git clone --depth 1 https://github.com/interactivetools-com/SmartArray.git ../SmartArray

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
          # JIT set explicitly either way: runner images ship a non-zero jit_buffer_size
          ini-values: ${{ inputs.jit == 'on' && 'opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M' || 'opcache.enable_cli=1, opcache.jit=off, opcache.jit_buffer_size=0' }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null && break
            sleep 1
          done

      - name: Run probe
        env:
          DB_HOSTNAME: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_DATABASE: phpunit_test_db
          # scale and filter are free-form text: pass them as env vars so the
          # shell gets them as data, never as script source
          SCALE: ${{ inputs.scale }}
          FILTER: ${{ inputs.filter }}
        run: |
          DB_SLUG=$(echo "${{ inputs.database || 'mysql:8.0' }}" | tr ':/' '--')
          SLUG="zendb-php${{ matrix.php }}-$DB_SLUG${{ inputs.jit == 'on' && '-jit' || '' }}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          php .github/scripts/escape-zendb-probe.php \
            --json="probe-$SLUG.json" \
            --scale="$SCALE" \
            ${FILTER:+--filter="$FILTER"} \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ env.SLUG }}
          path: probe-*.json
          if-no-files-found: ignore

  summary:
    name: Merge comparison grid
    runs-on: ubuntu-latest
    needs: probe
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: Download probe results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: probe-zendb-*
          merge-multiple: true
          path: probes

      - name: Build comparison grid
        run: php .github/scripts/escape-merge.php probes/*.json >> "$GITHUB_STEP_SUMMARY"
