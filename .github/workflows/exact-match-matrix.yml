name: Exact Match Matrix

# Compares the ways of writing an exact string comparison on every database in the matrix:
# which stored/sent pairs each form matches per column collation, which forms warn or error,
# which keep an index lookup on a plain, unique and prefix index, and how fast each one is.
# Also strings against INT columns, numbers against VARCHAR columns, and unique-key collisions.
# Manual-only. Dispatch with: gh workflow run exact-match-matrix.yml --ref <branch>
# To check images outside the matrix: gh workflow run exact-match-matrix.yml -f databases="mariadb:12.0 mysql:8.3"
on:
  workflow_dispatch:
    inputs:
      databases:
        description: 'Docker images to probe, space-separated (blank = .github/db-matrix.json)'
        required: false
        type: string
      rows:
        description: 'Rows in each speed-test table'
        required: false
        default: '100000'
        type: string

# the jobs only read the code
permissions:
  contents: read

jobs:
  db-matrix:
    name: Load database matrix
    runs-on: ubuntu-slim  # starts faster; has no PHP or Docker
    timeout-minutes: 15
    outputs:
      databases: ${{ steps.load.outputs.databases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      - name: Read the databases input or .github/db-matrix.json
        id: load
        env:
          DATABASES: ${{ inputs.databases }}  # free-form text: passed as an env var so the shell gets it as data
        run: |
          if [ -n "$DATABASES" ]; then
            echo "databases=$(jq -cn --arg list "$DATABASES" '$list | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          else
            echo "databases=$(jq -c . .github/db-matrix.json)" >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    needs: db-matrix
    timeout-minutes: 45  # about 10 minutes with 100,000 rows

    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.db-matrix.outputs.databases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5  # takes under 3 min; setup-php can hang on macOS
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none

      # Started by hand, not as a service, so the image's default settings are what the probe sees
      # and the start matches the other probe workflows
      - name: Start database
        env:
          IMAGE: ${{ matrix.database }}
        run: |
          docker run -d --name database -p 3306:3306 --security-opt seccomp=unconfined \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_ROOT_HOST=% \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes -e MARIADB_ROOT_HOST=% \
            "$IMAGE"
          for i in $(seq 1 120); do
            mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null && break
            sleep 1
          done
          mysqladmin ping -h 127.0.0.1 -u root || { docker logs database; exit 1; }

      - name: Run probe
        env:
          DB_HOSTNAME: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_LABEL: ${{ matrix.database }}
          ROWS: ${{ inputs.rows || '100000' }}
        run: |
          SLUG=$(echo "$DB_LABEL" | tr ':/' '--')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          php .github/scripts/exact-match-probe.php --rows="$ROWS" --json="exact-match-probe-$SLUG.json"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-match-probe-${{ env.SLUG }}
          path: exact-match-probe-*.json
          if-no-files-found: ignore

  summary:
    name: Compare servers
    runs-on: ubuntu-latest
    needs: probe
    timeout-minutes: 15
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      - name: Download probe results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exact-match-probe-*
          merge-multiple: true
          path: probes

      - name: Build comparison
        run: |
          php .github/scripts/exact-match-probe.php --merge probes/*.json > exact-match-matrix.md
          php .github/scripts/exact-match-probe.php --merge --data probes/*.json > exact-match-matrix-data.md
          cat exact-match-matrix.md exact-match-matrix-data.md | head -c 900000 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-match-matrix
          path: |
            exact-match-matrix.md
            exact-match-matrix-data.md
