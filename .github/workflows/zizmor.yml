name: zizmor

# Checks the workflow and Dependabot files for security problems: token
# permissions, script injection, unpinned actions. Runs only when something
# under .github/ changes, so pushes that only touch the code don't wait on it.
on:
  push:
    branches: [main, dev]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

# the jobs only read the code
permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no step uses git with the token, so don't leave it in .git/config

      # The pin also fixes the zizmor version, so Dependabot updates both together
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false  # print findings and fail the job; the Security tab upload needs write access
